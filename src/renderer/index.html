<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlickrFetch</title>
    <style>
      :root {
        color-scheme: light;   /* the app is light only: keeps form controls and scrollbars light in Mac Dark Mode */
        --ff-blue:           #0063DC;
        --ff-pink:           #FF0084;
        --ff-pink-action:    #D00069;
        --ff-navy:           #1B2946;
        --ff-cream:          #FCFAF6;
        --ff-white:          #FFFFFF;
        --ff-text-secondary: #667085;
        --ff-border:         #E5E7EB;
        --ff-success:        #16A34A;
        --ff-error:          #DC2626;
        --ff-success-bg:     #E8F8EA;
        --ff-error-bg:       #FCE8E8;
        --ff-warning:        #D97706;   /* amber marks (dots, bars, rings): 3.2:1 on white. Was #F59E0B (2.2:1) */
        --ff-warning-bg:     #FEF3C7;
        --ff-warning-text:   #92400E;   /* amber words on the pale amber */
        --ff-error-ink:      #B91C1C;   /* red words on white or on --ff-error-bg */
        --ff-success-ink:    #15803D;   /* green words on white or on --ff-success-bg */
        --ff-fine:           #8693A6;   /* the thin outline of a Fine mark: 3.1:1 on white */
        --ff-fine-fill:      #CBD0D8;   /* the light fill of a Fine mark */
        --ff-surface:        #FFFFFF;   /* cards, panels, dialogs, inputs */
        --ff-grey-100:       #F3F4F6;   /* quiet fill: disabled fields */
        --ff-map-water:      #DBE7F3;   /* the Map tab's illustration */
        --ff-map-land:       #F4F1EA;
        --ff-map-edge:       #C4BEB0;
        --ff-shadow-menu:    0 6px 20px rgba(0,0,0,0.14);   /* a menu or card floating over the page (the shadow scale is #233) */
        --ff-shadow-soft:    rgba(0,0,0,0.12);   /* the colour of a light shadow or a hairline wash (cards, small raised things) */
        --ff-shadow-mid:     rgba(0,0,0,0.18);   /* menus, popovers, raised panels */
        --ff-shadow-strong:  rgba(0,0,0,0.30);   /* dialogs and the photo view */
        --ff-scrim:          rgba(0,0,0,0.50);   /* the dimmed backdrop behind a dialog */
        --ff-scrim-strong:   rgba(0,0,0,0.65);   /* a darker veil: the photo view, over-photo captions */
        --ff-badge-bg:       rgba(0,0,0,0.55);   /* small labels sitting on a photo */
        --ff-glass:          rgba(255,255,255,0.85);   /* a white panel over a photo or map */
        --ff-glass-soft:     rgba(255,255,255,0.75);   /* a lighter white chip over a photo */
        --ff-info-bg:        #EEF5FF;   /* pale blue fill: a note or a chip that informs */
        --ff-info-line:      #CFE0F7;   /* the edge of that pale blue */
        --ff-stage:          #111111;   /* the dark behind a photo or video */
        --ff-wash-hover:     rgba(0,0,0,0.05);   /* the tint a bordered button or select takes under the pointer (#232) */
        --ff-wash-press:     rgba(0,0,0,0.10);   /* and while it is pressed */
        --ff-z-sticky:       10;    /* layers, lowest to highest: a sticky bar or raised card, */
        --ff-z-menu:         100;   /* a menu or dropdown, */
        --ff-z-dialog:       200;   /* a dialog with its backdrop (and the full-window photo view), */
        --ff-z-toast:        300;   /* a toast or banner, */
        --ff-z-hover:        400;   /* and the hover card, above everything */
        --ff-slate:          #94A3B8;
        --ff-text:           #111827;
        --ff-text-muted:     #9CA3AF;
        --ff-tint:           #FFF0F7;   /* selected: soft pink */
        --ff-warm:           #F7F5F1;   /* warm panel background */
        --ff-line-strong:    #D4D4D8;   /* quiet button edge */
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
      body { font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif; }
      button, input, select, textarea { font-family: inherit; }
      #root { height: 100%; }

      /* States, set once for the whole app (#232). Components keep their own looks for the resting state; these add what they cannot write inline. */
      /* Keyboard focus: one ring on everything. !important because some controls turn their outline off inline. Mouse clicks do not show it. */
      :focus-visible { outline: 2px solid var(--ff-blue) !important; outline-offset: 2px !important; }
      /* A tab button (marked --ff-tab in ui/kit.ts) keeps its ring inside itself, with soft corners, so it does not butt against the bar around it. */
      button[style*="--ff-tab"]:focus-visible { outline-offset: -3px !important; border-radius: 6px; }
      /* Hover and pressed: a bordered button or a select takes a grey tint (a wash over its own colour, so a pink button stays pink). Buttons from ui/kit.ts carry the --ff-box marker; other bordered buttons are matched by their written-out border. */
      button[style*="--ff-box"]:not(:disabled):hover, button[style*="border: 1px"]:not(:disabled):hover, select:not(:disabled):hover { background-image: linear-gradient(var(--ff-wash-hover), var(--ff-wash-hover)); }
      button[style*="--ff-box"]:not(:disabled):active, button[style*="border: 1px"]:not(:disabled):active { background-image: linear-gradient(var(--ff-wash-press), var(--ff-wash-press)); }
      /* Disabled: half strength and a not-allowed pointer; a disabled field is filled grey. A component that dims itself keeps its own opacity. */
      :disabled { cursor: not-allowed !important; }
      button:disabled, select:disabled, input:disabled, textarea:disabled { opacity: 0.5; }
      input:disabled:not([type="checkbox"]):not([type="radio"]), select:disabled, textarea:disabled { background-color: var(--ff-grey-100) !important; }
      /* Checkboxes and radio buttons follow the pink selection rule. */
      input[type="checkbox"], input[type="radio"] { accent-color: var(--ff-pink-action); }
      /* Motion: when the Mac is set to reduce motion, animations and transitions are switched off. A spinner that shows work is going on keeps turning (data-motion="keep"). */
      @media (prefers-reduced-motion: reduce) {
        *:not([data-motion="keep"]), *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
