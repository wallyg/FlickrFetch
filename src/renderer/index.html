<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlickrFetch</title>
    <style>
      :root {
        color-scheme: light;   /* the app is light only: keeps form controls and scrollbars light in Mac Dark Mode */
        --ff-blue:           #0063DC;
        --ff-pink:           #FF0084;
        --ff-pink-action:    #D00069;
        --ff-navy:           #1B2946;
        --ff-cream:          #FCFAF6;
        --ff-white:          #FFFFFF;
        --ff-text-secondary: #667085;
        --ff-border:         #E5E7EB;
        --ff-success:        #16A34A;
        --ff-error:          #DC2626;
        --ff-success-bg:     #E8F8EA;
        --ff-error-bg:       #FCE8E8;
        --ff-warning:        #D97706;   /* amber marks (dots, bars, rings): 3.2:1 on white. Was #F59E0B (2.2:1) */
        --ff-warning-bg:     #FEF3C7;
        --ff-warning-text:   #92400E;   /* amber words on the pale amber */
        --ff-error-ink:      #B91C1C;   /* red words on white or on --ff-error-bg */
        --ff-success-ink:    #15803D;   /* green words on white or on --ff-success-bg */
        --ff-fine:           #8693A6;   /* the thin outline of a Fine mark: 3.1:1 on white */
        --ff-fine-fill:      #CBD0D8;   /* the light fill of a Fine mark */
        --ff-surface:        #FFFFFF;   /* cards, panels, dialogs, inputs */
        --ff-grey-100:       #F3F4F6;   /* quiet fill: disabled fields */
        --ff-map-water:      #DBE7F3;   /* the Map tab's illustration */
        --ff-map-land:       #F4F1EA;
        --ff-map-edge:       #C4BEB0;
        --ff-shadow-menu:    0 6px 20px rgba(0,0,0,0.14);   /* a menu or card floating over the page (the shadow scale is #233) */
        --ff-shadow-soft:    rgba(0,0,0,0.12);   /* the colour of a light shadow or a hairline wash (cards, small raised things) */
        --ff-shadow-mid:     rgba(0,0,0,0.18);   /* menus, popovers, raised panels */
        --ff-shadow-strong:  rgba(0,0,0,0.30);   /* dialogs and the photo view */
        --ff-scrim:          rgba(0,0,0,0.50);   /* the dimmed backdrop behind a dialog */
        --ff-scrim-strong:   rgba(0,0,0,0.65);   /* a darker veil: the photo view, over-photo captions */
        --ff-badge-bg:       rgba(0,0,0,0.55);   /* small labels sitting on a photo */
        --ff-glass:          rgba(255,255,255,0.85);   /* a white panel over a photo or map */
        --ff-glass-soft:     rgba(255,255,255,0.75);   /* a lighter white chip over a photo */
        --ff-info-bg:        #EEF5FF;   /* pale blue fill: a note or a chip that informs */
        --ff-info-line:      #CFE0F7;   /* the edge of that pale blue */
        --ff-stage:          #111111;   /* the dark behind a photo or video */
        --ff-z-sticky:       10;    /* layers, lowest to highest: a sticky bar or raised card, */
        --ff-z-menu:         100;   /* a menu or dropdown, */
        --ff-z-dialog:       200;   /* a dialog with its backdrop (and the full-window photo view), */
        --ff-z-toast:        300;   /* a toast or banner, */
        --ff-z-hover:        400;   /* and the hover card, above everything */
        --ff-slate:          #94A3B8;
        --ff-text:           #111827;
        --ff-text-muted:     #9CA3AF;
        --ff-tint:           #FFF0F7;   /* selected: soft pink */
        --ff-warm:           #F7F5F1;   /* warm panel background */
        --ff-line-strong:    #D4D4D8;   /* quiet button edge */
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
      body { font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif; }
      button, input, select, textarea { font-family: inherit; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
